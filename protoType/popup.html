<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Project-Vision</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      width: 420px;
      min-height: 600px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #ffffff;
      color: #222;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 58px;
      padding: 12px 16px;

      border-bottom: 1px solid #e5e5e5;

      display: flex;
      align-items: center;
      justify-content: space-between;

      flex-shrink: 0;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
    }

    .subtitle {
      margin-top: 2px;
      font-size: 11px;
      color: #888;
    }

    #clear {
      width: auto;
      margin: 0;
      padding: 6px 9px;

      border: 1px solid #ddd;
      border-radius: 6px;

      background: #fff;
      color: #555;

      cursor: pointer;
    }

    #clear:hover {
      background: #f5f5f5;
    }

    #messages {
      flex: 1;

      overflow-y: auto;

      padding: 16px 12px;

      display: flex;
      flex-direction: column;
      gap: 12px;

      background: #fafafa;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.server,
    .message-row.system {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 86%;

      padding: 10px 12px;

      border-radius: 12px;

      font-size: 13px;
      line-height: 1.45;

      overflow-wrap: anywhere;
    }

    .message-row.user
    .message-bubble {
      background: #222;
      color: white;

      border-bottom-right-radius: 4px;
    }

    .message-row.server
    .message-bubble {
      background: white;
      color: #222;

      border: 1px solid #e5e5e5;

      border-bottom-left-radius: 4px;
    }

    .message-row.system
    .message-bubble {
      background: #f0f0f0;
      color: #666;

      font-size: 12px;
    }

    .message-label {
      margin-bottom: 5px;

      font-size: 10px;
      font-weight: 600;

      color: #888;
      text-transform: uppercase;
    }

    .message-text {
      white-space: pre-wrap;
    }

    .json-details {
      margin-top: 9px;

      border-top: 1px solid #eee;
      padding-top: 7px;
    }

    .json-details summary {
      cursor: pointer;

      color: #777;

      font-size: 11px;
    }

    .json-details pre {
      max-width: 100%;

      margin-top: 7px;
      padding: 8px;

      overflow-x: auto;

      background: #f5f5f5;

      border-radius: 5px;

      font-family:
        "Cascadia Code",
        "Consolas",
        monospace;

      font-size: 10px;
      line-height: 1.4;

      white-space: pre-wrap;
    }

    .screenshot {
      display: block;

      width: 100%;
      max-height: 280px;

      object-fit: contain;

      margin-top: 8px;

      border-radius: 7px;

      border: 1px solid #ddd;
    }

    .composer {
      padding: 10px;

      border-top: 1px solid #e5e5e5;

      background: white;

      flex-shrink: 0;
    }

    .input-container {
      display: flex;
      align-items: flex-end;

      gap: 8px;

      padding: 8px;

      border: 1px solid #ccc;

      border-radius: 12px;

      background: white;
    }

    #prompt {
      flex: 1;

      min-height: 38px;
      max-height: 120px;

      resize: none;

      border: none;
      outline: none;

      font-family: inherit;
      font-size: 13px;

      line-height: 1.4;
    }

    #prompt::placeholder {
      color: #999;
    }

    #send {
      width: 34px;
      height: 34px;

      margin: 0;

      padding: 0;

      border: none;
      border-radius: 8px;

      background: #222;
      color: white;

      cursor: pointer;

      font-size: 17px;
    }

    #send:hover {
      opacity: 0.85;
    }

    #send:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .tools {
      display: flex;
      gap: 6px;

      margin-top: 7px;
    }

    .tool-button {
      width: auto;

      margin: 0;

      padding: 5px 8px;

      border: 1px solid #ddd;
      border-radius: 5px;

      background: white;
      color: #666;

      font-size: 10px;

      cursor: pointer;
    }

    .tool-button:hover {
      background: #f5f5f5;
    }

    #status {
      padding: 5px 2px 0;

      font-size: 10px;
      color: #999;

      min-height: 18px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div>
      <div class="title">
        Project-Vision
      </div>

      <div class="subtitle">
        On-device visual browser agent
      </div>
    </div>

    <button id="clear">
      Clear
    </button>
  </div>

  <div id="messages">
  </div>

  <div class="composer">

    <div class="input-container">

      <textarea
        id="prompt"
        rows="1"
        placeholder="Message your browser agent..."
      ></textarea>

      <button
        id="send"
        title="Send"
      >
        ↑
      </button>

    </div>

    <div class="tools">

      <button
        id="screenshot"
        class="tool-button"
      >
        Screenshot
      </button>

      <button
        id="demo"
        class="tool-button"
      >
        Demo: Google
      </button>

    </div>

    <div id="status">
      Ready
    </div>

  </div>

  <script
    type="module"
    src="dist/popup.js"
  ></script>

</body>
</html>
