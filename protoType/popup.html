<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Vision</title>
  <style>
    body {
      width: 320px;
      padding: 15px;
      font-family: system-ui, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #89b4fa;
      color: #11111b;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #b4befe; }
    #preview {
      width: 100%;
      margin-top: 15px;
      border-radius: 6px;
      border: 1px solid #45475a;
      display: none;
    }
  </style>
</head>
<body>
  <h3>Project Vision</h3>
  <button id="captureBtn">Sanitize Screen</button>
  <img id="preview" alt="Sanitized Preview" />

  <script src="dist/popup.js"></script>
</body>
</html>
