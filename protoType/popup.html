<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Project Vision</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 420px;
      height: 600px;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f7f8;
      color: #202123;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      padding: 14px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 11px;
      color: #777;
      margin-top: 2px;
    }

    #clearBtn {
      border: 0;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 12px;
    }

    #clearBtn:hover {
      color: #222;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    .message {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.server,
    .message.system {
      align-items: flex-start;
    }

    .bubble {
      max-width: 90%;
      padding: 10px 12px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.4;
    }

    .user .bubble {
      background: #202123;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .server .bubble {
      background: white;
      border: 1px solid #e4e4e4;
      border-bottom-left-radius: 4px;
    }

    .system .bubble {
      background: #ececf1;
      color: #666;
      font-size: 11px;
    }

    .type {
      font-size: 9px;
      color: #999;
      margin: 3px 5px;
      text-transform: uppercase;
    }

    details {
      margin-top: 7px;
      width: 100%;
    }

    summary {
      cursor: pointer;
      font-size: 11px;
      color: #666;
    }

    pre {
      margin: 6px 0 0;
      padding: 8px;
      background: #111;
      color: #eee;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 10px;
      white-space: pre-wrap;
    }

    .screenshot {
      max-width: 100%;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .composer {
      padding: 10px;
      background: white;
      border-top: 1px solid #e5e5e5;
    }

    .composer-row {
      display: flex;
      gap: 8px;
    }

    #prompt {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      padding: 10px 12px;
      border: 1px solid #d9d9e0;
      border-radius: 12px;
      outline: none;
      font: inherit;
      font-size: 13px;
    }

    #prompt:focus {
      border-color: #999;
    }

    #sendBtn {
      width: 70px;
      border: 0;
      border-radius: 12px;
      background: #202123;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">
      <div>
        <div class="title">Project Vision</div>
        <div class="subtitle">
          Privacy-preserving browser agent
        </div>
      </div>

      <button id="clearBtn">
        Clear
      </button>
    </div>

    <div id="messages"></div>

    <div class="composer">
      <div class="composer-row">
        <textarea
          id="prompt"
          placeholder="Tell the browser agent what to do..."
        ></textarea>

        <button id="sendBtn">
          Send
        </button>
      </div>
    </div>

  </div>

  <script src="dist/popup.js"></script>
</body>
</html>
