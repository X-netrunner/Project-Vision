<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Project-Vision</title>

  <style>
    body {
      width: 340px;
      padding: 16px;
      font-family: Arial, sans-serif;
    }

    h3 {
      margin-top: 0;
    }

    button {
      width: 100%;
      margin-bottom: 8px;
      padding: 10px;
      cursor: pointer;
    }

    #status {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      min-height: 40px;
      word-break: break-word;
    }

    .section {
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h3>Project-Vision</h3>

  <div class="section">
    Agent
  </div>

  <button id="start">
    Start Agent
  </button>

  <button id="demo">
    Example: Open Google
  </button>

  <div class="section">
    Local Debug Tests
  </div>

  <button id="screenshot">
    Test Screenshot + Base64
  </button>

  <button id="click">
    Test Click
  </button>

  <button id="type">
    Test Type: ISRO
  </button>

  <button id="enter">
    Test Press: Enter
  </button>

  <button id="scroll">
    Test Scroll
  </button>

  <div id="status">
    Ready
  </div>

  <script type="module" src="dist/popup.js"></script>
</body>
</html>
