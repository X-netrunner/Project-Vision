<!DOCTYPE html>
<html lang="en" data-theme="dark" style="width: 360px !important; height: 520px !important; min-width: 360px !important; max-width: 360px !important; min-height: 520px !important; max-height: 520px !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; background: #07090E !important;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=360, height=520, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <title>Project Vision</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&display=swap');

    :root, [data-theme="dark"] {
      --bg-canvas: #0D111A;
      --card-surface: rgba(22, 27, 38, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-pri: #F3F4F6;
      --text-sec: #9CA3AF;
      --input-bg: rgba(255, 255, 255, 0.06);

      --accent-violet: #8B5CF6;
      --accent-emerald: #10B981;
      --accent-amber: #F59E0B;
      --accent-rose: #F43F5E;
      --accent-cyan: #06B6D4;
      --accent-indigo: #6366F1;
      --pill-active-bg: #8B5CF6;
      --pill-active-text: #FFFFFF;

      --edge-canvas-fill: radial-gradient(circle at 50% 0%, #2E1065 0%, #083344 40%, #07090E 90%);
      --menu-bg: #141923;
      --user-msg-bg: rgba(139, 92, 246, 0.22);
      --user-msg-border: rgba(139, 92, 246, 0.45);
      --agent-msg-bg: rgba(255, 255, 255, 0.05);
      --agent-msg-border: rgba(255, 255, 255, 0.1);
      --toggle-track: rgba(255, 255, 255, 0.16);

      --ngrok-input-bg: rgba(0, 0, 0, 0.25);
    }

    [data-theme="light"] {
      --bg-canvas: #FFFFFF;
      --card-surface: rgba(244, 246, 251, 0.92);
      --card-border: rgba(0, 0, 0, 0.08);
      --text-pri: #111827;
      --text-sec: #6B7280;
      --input-bg: rgba(0, 0, 0, 0.04);

      --accent-violet: #7C3AED;
      --accent-emerald: #059669;
      --accent-amber: #D97706;
      --accent-rose: #E11D48;
      --accent-cyan: #0284C7;
      --accent-indigo: #4F46E5;
      --pill-active-bg: #7C3AED;
      --pill-active-text: #FFFFFF;

      --edge-canvas-fill: radial-gradient(circle at 50% 0%, #DDD6FE 0%, #CFFAFE 40%, #E2E8F0 90%);
      --menu-bg: #FFFFFF;
      --user-msg-bg: rgba(124, 58, 237, 0.12);
      --user-msg-border: rgba(124, 58, 237, 0.3);
      --agent-msg-bg: rgba(0, 0, 0, 0.04);
      --agent-msg-border: rgba(0, 0, 0, 0.08);
      --toggle-track: #8B5CF6;

      --ngrok-input-bg: #F8FAFC;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

    html, body {
      width: 360px !important; height: 520px !important;
      min-width: 360px !important; max-width: 360px !important;
      min-height: 520px !important; max-height: 520px !important;
      overflow: hidden !important;
      background: var(--edge-canvas-fill) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex !important; align-items: center !important; justify-content: center !important;
    }

    .agent-shell {
      width: calc(100% - 16px) !important; height: calc(100% - 16px) !important;
      background: var(--bg-canvas) !important; color: var(--text-pri) !important;
      border-radius: 20px !important; border: 1.5px solid rgba(139, 92, 246, 0.45) !important;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(139, 92, 246, 0.3) !important;
      display: flex !important; flex-direction: column !important; position: relative !important; overflow: hidden !important;
    }

    .agent-shell::before {
      content: ""; position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
      width: 220px; height: 80px; background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .hud-bar {
      height: 48px; min-height: 48px; padding: 0 12px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--card-border); background: var(--card-surface); backdrop-filter: blur(12px); z-index: 2;
    }

    .brand-cluster { display: flex; align-items: center; gap: 7px; }
    .brand-title {
      font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
      background: linear-gradient(135deg, #FFFFFF 20%, var(--accent-cyan) 60%, var(--accent-violet) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.4)); user-select: none;
    }
    [data-theme="light"] .brand-title { background: linear-gradient(135deg, #0F172A 20%, var(--accent-violet) 70%, var(--accent-cyan) 100%); filter: none; }

    .pixel-eye { display: block; width: 15px; height: 15px; filter: drop-shadow(0 0 4px rgba(6, 182, 212, 0.5)); }

    .status-chip {
      display: flex; align-items: center; gap: 4px; font-size: 8.5px; font-weight: 800; color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); padding: 1.5px 6px; border-radius: 999px;
      max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pulse-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-emerald); box-shadow: 0 0 5px var(--accent-emerald); flex-shrink: 0; }
    .pulse-dot.waiting { background: var(--accent-amber); box-shadow: 0 0 5px var(--accent-amber); }
    .pulse-dot.error { background: var(--accent-rose); box-shadow: 0 0 5px var(--accent-rose); }

    .hud-actions { display: flex; align-items: center; position: relative; }
    .btn-icon {
      background: var(--input-bg); color: var(--text-sec); width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; border: 1px solid var(--card-border); cursor: pointer; transition: 0.15s ease;
    }
    .btn-icon:hover { color: var(--text-pri); border-color: var(--accent-violet); }

    .settings-dropdown {
      display: none; position: absolute; top: 34px; right: 0; background: var(--menu-bg); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 8px 10px; width: 250px; max-height: 400px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55); z-index: 999; backdrop-filter: blur(14px);
    }
    .settings-dropdown.active { display: block !important; }

    .menu-item-row { display: flex; align-items: center; justify-content: space-between; user-select: none; cursor: pointer; padding: 5px 0; }
    .menu-divider { height: 1px; background: var(--card-border); margin: 6px 0; }
    .theme-label-group { display: flex; flex-direction: column; gap: 1px; pointer-events: none; }
    .theme-title { font-size: 11px; font-weight: 700; color: var(--text-pri); }
    .theme-mode-text { font-size: 9px; color: var(--text-sec); }

    .switch-track { width: 34px; height: 18px; background: rgba(255, 255, 255, 0.16); border-radius: 999px; position: relative; border: 1px solid var(--card-border); pointer-events: none; }
    .switch-thumb { width: 14px; height: 14px; background: #FFFFFF; border-radius: 50%; position: absolute; top: 1px; left: 1px; transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
    .switch-track.on { background: var(--accent-violet) !important; border-color: var(--accent-violet) !important; }
    .switch-track.on .switch-thumb { transform: translateX(16px) !important; }

    .controls-panel, .ngrok-panel {
      display: none; flex-direction: column; gap: 6px; margin-top: 6px; padding: 8px; background: var(--input-bg); border-radius: 6px; border: 1px solid var(--card-border);
    }
    .controls-panel.expanded, .ngrok-panel.expanded { display: flex !important; }

    .controls-grid { display: flex; gap: 5px; flex-wrap: wrap; }
    .control-btn {
      flex: 1; font-size: 9.5px; font-weight: 700; padding: 6px 4px; border-radius: 5px; border: 1px solid var(--card-border); background: var(--card-surface); color: var(--text-pri); cursor: pointer;
    }
    .control-btn:hover { border-color: var(--accent-violet); background: rgba(139, 92, 246, 0.15); }
    .control-btn.danger { color: var(--accent-rose); border-color: rgba(244, 63, 94, 0.3); }
    .control-btn.danger:hover { background: rgba(244, 63, 94, 0.15); border-color: var(--accent-rose); }

    .ngrok-header-label { font-size: 9px; font-weight: 800; letter-spacing: 0.06em; color: var(--accent-cyan); }
    .ngrok-input {
      width: 100%; background: var(--ngrok-input-bg); border: 1px solid var(--card-border); border-radius: 5px; padding: 6px 7px; font-size: 10px; color: var(--text-pri); font-family: ui-monospace, monospace;
    }
    .ngrok-input::placeholder { color: var(--text-sec); opacity: 0.5; font-style: italic; }
    .ngrok-status-line { font-size: 9px; color: var(--accent-amber); display: flex; justify-content: space-between; align-items: center; }
    .ngrok-btn-row { display: flex; gap: 5px; margin-top: 2px; }
    .ngrok-btn { flex: 1; font-size: 9.5px; font-weight: 600; padding: 5px 6px; border-radius: 4px; border: 1px solid var(--card-border); background: var(--card-surface); color: var(--text-pri); cursor: pointer; }
    .ngrok-btn:hover { border-color: var(--accent-violet); }

    .content-area { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 1; scroll-behavior: smooth; }
    .terminal-thread { display: flex; flex-direction: column; gap: 10px; width: 100%; }

    /* Clean Chat Bubble Styles (JSON & Screenshots) */
    .message-row { display: flex; width: 100%; }
    .message-row.user { justify-content: flex-end; }
    .message-row.server, .message-row.system { justify-content: flex-start; }

    .message-bubble {
      max-width: 92%; padding: 10px 12px; font-size: 11.5px; line-height: 1.45; overflow-wrap: anywhere; border-radius: 12px; animation: fadeInMsg 0.18s ease-out forwards;
    }
    @keyframes fadeInMsg { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .message-row.user .message-bubble { background: var(--user-msg-bg); border: 1px solid var(--user-msg-border); border-bottom-right-radius: 4px; color: var(--text-pri); }
    .message-row.server .message-bubble, .message-row.system .message-bubble { background: var(--agent-msg-bg); border: 1px solid var(--agent-msg-border); border-bottom-left-radius: 4px; color: var(--text-sec); }
    .message-row.system .message-bubble { font-size: 10.5px; }

    .message-label {
      margin-bottom: 5px; font-size: 9px; font-weight: 800; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.05em;
    }
    .message-row.system .message-label { color: var(--accent-violet); }
    .message-text { white-space: pre-wrap; color: var(--text-pri); }

    /* Screenshot & Interactive JSON Viewer */
    .screenshot {
      display: block; width: 100%; max-height: 240px; object-fit: contain; margin-top: 8px; border-radius: 6px; border: 1px solid var(--card-border); background: #000;
    }

    .json-details {
      margin-top: 8px; border: 1px solid var(--card-border); border-radius: 6px; background: rgba(0, 0, 0, 0.25); overflow: hidden;
    }
    .json-details summary {
      cursor: pointer; color: var(--accent-cyan); font-size: 9.5px; font-weight: 700; padding: 6px 8px; user-select: none; background: rgba(255, 255, 255, 0.02); transition: color 0.15s ease;
    }
    .json-details summary:hover { color: var(--accent-violet); }
    .json-details pre {
      padding: 8px; font-family: "Cascadia Code", Consolas, monospace; font-size: 9px; overflow-x: auto; color: var(--text-sec);
      border-top: 1px solid var(--card-border); white-space: pre-wrap; word-break: break-all; margin: 0; background: rgba(0, 0, 0, 0.5);
    }

    .omnibar-footer { padding: 10px 12px; background: var(--card-surface); border-top: 1px solid var(--card-border); backdrop-filter: blur(12px); z-index: 2; }
    .omnibar-wrap { display: flex; align-items: flex-end; background: var(--input-bg); border: 1px solid rgba(139, 92, 246, 0.4); border-radius: 14px; padding: 8px 10px; box-shadow: 0 0 14px rgba(139, 92, 246, 0.12); gap: 8px; }
    
    .omnibar-wrap textarea {
      flex: 1; background: transparent; border: none; color: var(--text-pri); outline: none; font-size: 12px; resize: none; font-family: inherit; line-height: 1.4; min-height: 18px; max-height: 80px; padding: 2px 0;
    }
    .omnibar-wrap textarea::placeholder { color: var(--text-sec); }

    .send-pill {
      background: linear-gradient(135deg, #A855F7 0%, #06B6D4 100%) !important; border: 1.5px solid rgba(255, 255, 255, 0.4) !important; color: #FFFFFF !important;
      border-radius: 10px !important; width: 34px !important; height: 34px !important; min-width: 34px !important; cursor: pointer; font-weight: 900 !important;
      display: flex; align-items: center; justify-content: center; font-size: 18px !important; box-shadow: 0 0 14px rgba(168, 85, 247, 0.6), 0 2px 6px rgba(0, 0, 0, 0.4) !important; transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .send-pill:hover { transform: scale(1.06); box-shadow: 0 0 18px rgba(6, 182, 212, 0.8), 0 3px 8px rgba(0, 0, 0, 0.5) !important; }
    .send-pill:active { transform: scale(0.94); }
    .send-pill:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none !important; transform: none !important; }
  </style>
</head>
<body>

  <div class="agent-shell">
    <header class="hud-bar">
      <div class="brand-cluster">
        <span class="brand-title">PROJECT VISION</span>
        <svg class="pixel-eye" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="3" width="6" height="1.5" fill="var(--accent-cyan)"/>
          <rect x="3" y="4.5" width="2" height="1.5" fill="var(--accent-cyan)"/>
          <rect x="11" y="4.5" width="2" height="1.5" fill="var(--accent-cyan)"/>
          <rect x="1" y="6" width="2" height="4" fill="var(--accent-cyan)"/>
          <rect x="13" y="6" width="2" height="4" fill="var(--accent-cyan)"/>
          <rect x="3" y="10" width="2" height="1.5" fill="var(--accent-cyan)"/>
          <rect x="11" y="10" width="2" height="1.5" fill="var(--accent-cyan)"/>
          <rect x="5" y="11.5" width="6" height="1.5" fill="var(--accent-cyan)"/>
          <rect x="6" y="6" width="4" height="4" fill="var(--accent-violet)"/>
          <rect x="6" y="6" width="1.5" height="1.5" fill="#FFFFFF"/>
        </svg>
        <div class="status-chip">
          <span class="pulse-dot" id="statusDot"></span>
          <span id="statusLabel">READY</span>
        </div>
      </div>

      <div class="hud-actions">
        <button id="settingsBtn" class="btn-icon" title="Settings">⚙</button>

        <div id="settingsDropdown" class="settings-dropdown">
          <div id="themeToggleRow" class="menu-item-row">
            <div class="theme-label-group">
              <span class="theme-title">Light Mode</span>
              <span class="theme-mode-text" id="themeModeText">Off (Default Dark)</span>
            </div>
            <div class="switch-track" id="themeSwitchTrack"><div class="switch-thumb"></div></div>
          </div>

          <div class="menu-divider"></div>

          <div id="controlsToggleRow" class="menu-item-row">
            <div class="theme-label-group">
              <span class="theme-title">Controls</span>
              <span class="theme-mode-text">Pause, reroute, clear</span>
            </div>
            <span id="controlsArrow" style="font-size: 8px; color: var(--text-sec); pointer-events: none;">▶</span>
          </div>

          <div id="controlsPanel" class="controls-panel">
            <span class="ngrok-header-label">SESSION CONTROLS</span>
            <div class="controls-grid">
              <button id="clearChatBtn" class="control-btn danger" style="flex: 1 1 100%;">🗑 Clear Chat Memory</button>
            </div>
          </div>

          <div class="menu-divider"></div>

          <div id="ngrokToggleRow" class="menu-item-row">
            <div class="theme-label-group">
              <span class="theme-title">ngrok Token</span>
              <span class="theme-mode-text">Server Connection Setup</span>
            </div>
            <span id="ngrokArrow" style="font-size: 8px; color: var(--text-sec); pointer-events: none;">▶</span>
          </div>

          <div id="ngrokPanel" class="ngrok-panel">
            <span class="ngrok-header-label">SERVER CONNECTION</span>
            <input type="text" id="srijanUrl" class="ngrok-input" placeholder="wss://your-ngrok-domain.ngrok.app/ws" />
            <div class="ngrok-status-line">
              <span id="urlSavedStatus" style="color: var(--accent-emerald); font-size: 8.5px;">URL not configured</span>
              <span id="srijanConnStatus" style="color: var(--accent-amber); font-size: 8.5px;">NOT CONFIGURED</span>
            </div>
            <div class="ngrok-btn-row">
              <button id="srijanUrlElement" class="ngrok-btn">Save URL</button>
              <button id="reconnectBtn" class="ngrok-btn">Reconnect</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="content-area" id="contentArea">
      <div class="terminal-thread" id="chatThread">
        <div class="message-row system">
          <div class="message-bubble">
            <div class="message-label">System</div>
            <div class="message-text">Agent Ready. Enter instructions below to dispatch browser directives.</div>
          </div>
        </div>
      </div>
    </main>

    <footer class="omnibar-footer">
      <div class="omnibar-wrap">
        <textarea id="promptInput" rows="1" placeholder="Message your browser agent..."></textarea>
        <button class="send-pill" id="sendBtn" title="Send">↑</button>
      </div>
    </footer>
  </div>

  <script type="module" src="dist/popup.js"></script>
</body>
</html>
