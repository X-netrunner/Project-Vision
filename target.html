<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PII Redaction Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .field { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <h2>Project Vision - PII Test Form</h2>
  
  <div class="card">
    <div class="field">
      <label>Public Username (Should NOT be masked)</label>
      <input type="text" placeholder="johndoe">
    </div>

    <div class="field">
      <label>Email Address (Should be masked)</label>
      <input type="email" placeholder="user@example.com">
    </div>

    <div class="field">
      <label>Password (Should be masked)</label>
      <input type="password" value="secretpassword123">
    </div>

    <div class="field">
      <label>Credit Card Number (Should be masked)</label>
      <input type="text" name="card-number" autocomplete="cc-number" placeholder="4532 XXXX XXXX 8921">
    </div>
  </div>
</body>
</html>
